[package]
name = "gtk-devtools-ui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Developer Toolbox GTK4/Libadwaita dialog for Ice Commander"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
devtools-core = { workspace = true }
ic-i18n = { workspace = true }
