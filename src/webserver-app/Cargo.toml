[package]
name = "webserver-app"
version = "0.7.92"
edition = "2021"
publish = false
description = "Ice Commander Web Server - Headless Dual-Pane File Manager (browser is the client)"
authors = ["Igor Savchenko <igor.savchenko@icecommander.com>"]
license = "MIT OR Apache-2.0"

# Headless web-server: the two-pane file manager as an HTTP/WS server with no GTK.
# Two GTK-free `PanelCore`s drive the same `panel-server` the desktop app uses; a tokio
# LocalSet dispatcher replaces the GLib loop. v1 = file manager + local drives.
# The browser is a full client of the core, not a remote pult. See specs/headless_panel_core.md.
[[bin]]
name = "nodeinnet-ice-webserver"
path = "src/main.rs"

[dependencies]
panel-core = { workspace = true }
panel-server = { workspace = true }
virtualfs = { path = "../virtualfs", default-features = false }
fm-core = { workspace = true }
ic-platform = { workspace = true }
client-config = { workspace = true }
secret-store = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.36", features = ["full", "rt-multi-thread"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"

client-core = { workspace = true, optional = true }
nodeinnet-p2p = { workspace = true, optional = true }
web-davserver = { workspace = true, optional = true }
p2p-sources = { workspace = true, optional = true }
p2p-runtime = { workspace = true, optional = true }
p2p-node = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
ic-model = { workspace = true }

[features]
default = ["nodeinnet"]
nodeinnet = [
    "dep:client-core",
    "dep:nodeinnet-p2p",
    "dep:web-davserver",
    "dep:p2p-sources",
    "dep:p2p-runtime",
    "dep:p2p-node",
    "virtualfs/nodeinnet",
    "client-config/nodeinnet",
    "fm-core/nodeinnet",
    "panel-server/nodeinnet",
]

# Linux packaging — a single GTK-free binary. No gtk/adwaita/desktop/icon: it's a
# web-server, not a desktop app (ssh2 uses vendored-openssl, so no runtime ssl dep either).
# The distro scripts copy the release binary to bin/webserver-app/release/ before packaging.
[package.metadata.deb]
name = "nodeinnet-ice-commander-webserver"
maintainer = "Ice Commander Team <support@icecommander.com>"
copyright = "2026, Ice Commander Team"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["../../bin/webserver-app/release/nodeinnet-ice-webserver", "/usr/bin/nodeinnet-ice-webserver", "755"],
]

[package.metadata.generate-rpm]
name = "nodeinnet-ice-commander-webserver"
assets = [
    { source = "../../bin/webserver-app/release/nodeinnet-ice-webserver", dest = "/usr/bin/nodeinnet-ice-webserver", mode = "755" },
]
